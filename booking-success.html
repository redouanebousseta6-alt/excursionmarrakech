<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 1500
      });
    </script>
    <link rel="preload" href="/fonts/fraunces-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/css/fonts.css" as="style" />
    <link rel="stylesheet" href="/css/fonts.css" />
<link rel="preload" href="css/styles.css" as="style" />
    <title>Booking confirmed | excursionmarrakech</title>
    <meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="/">excursion<span>marrakech</span></a>
        <button
          class="nav-toggle"
          type="button"
          data-nav-toggle
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Open menu"
        >
          <span></span><span></span><span></span>
        </button>
        <nav id="site-nav" class="nav" data-nav aria-label="Primary">
          <a href="/" data-page="home">Home</a>
          <a href="/trips" data-page="trips">All Trips</a>
          <a href="/about" data-page="about">About</a>
          <a href="/trips?category=desert">Desert</a>
          <a class="btn btn--primary" href="/trips">Book an excursion</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container" style="max-width: 640px">
        <span class="eyebrow">Thank you</span>
        <h1 id="success-title">We’re confirming your booking</h1>
        <p id="success-body">Loading booking details…</p>
        <div id="success-card" class="booking-card" style="margin-top: 1.5rem" hidden>
          <p><strong>Reference:</strong> <span id="ref"></span></p>
          <p><strong>Trip:</strong> <span id="trip-name"></span></p>
          <p><strong>Phone:</strong> <span id="phone"></span></p>
          <p><strong>Date:</strong> <span id="travel-date"></span></p>
          <p><strong>Travelers:</strong> <span id="travelers"></span></p>
          <p><strong>Price:</strong> <span id="total"></span></p>
          <p><strong>Status:</strong> <span id="status"></span></p>
        </div>
        <p style="margin-top: 1.5rem">
          <a class="btn btn--primary" href="/trips">Browse more trips</a>
        </p>
      </div>
    </main>

    <script src="js/currency.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tracking.js"></script>
    <script>
      (async function () {
        const params = new URLSearchParams(location.search);
        const bookingId = params.get("bookingId");
        const provider = params.get("provider");
        const token = params.get("token"); // PayPal may return token=ORDER_ID

        await EM.loadConfig();
        try {
          if (EM.initI18n) EM.initI18n();
        } catch (e) {
          console.warn("i18n init failed", e);
        }
        // Load Ads/GA tags immediately on the thank-you page so conversions can verify.
        EM.initTracking(EM.config);
        if (EM.config) {
          EM.config.googleAdsId = EM.config.googleAdsId || "AW-760950068";
          EM.config.googleAdsLeadConversionLabel =
            EM.config.googleAdsLeadConversionLabel || "wXz8CJffgOIcELTa7OoC";
          EM.config.googleAdsConversionLabel =
            EM.config.googleAdsConversionLabel || "JcIzCMjR9dIBELTa7OoC";
        }

        if (provider === "paypal" && (token || params.get("orderId"))) {
          try {
            await EM.api("/payments/paypal/capture", {
              method: "POST",
              body: JSON.stringify({
                orderId: token || params.get("orderId"),
                bookingId,
              }),
            });
          } catch (e) {
            console.warn(e);
          }
        }

        if (bookingId && provider === "stripe") {
          try {
            await EM.api("/payments/confirm-session", {
              method: "POST",
              body: JSON.stringify({ bookingId, provider: "stripe" }),
            });
          } catch (e) {
            console.warn(e);
          }
        }

        if (!bookingId) {
          document.getElementById("success-body").textContent =
            "Missing booking reference. Check your email or contact us.";
          return;
        }

        try {
          const b = await EM.api("/bookings/" + encodeURIComponent(bookingId));
          document.getElementById("success-card").hidden = false;
          document.getElementById("ref").textContent = b.id;
          document.getElementById("trip-name").textContent = b.tripTitle;
          document.getElementById("phone").textContent = b.phone || "—";
          document.getElementById("travel-date").textContent = b.travelDate;
          document.getElementById("travelers").textContent = b.travelers;
          var totalText = Number(b.totalAmount).toLocaleString("fr-MA") + " MAD";
          if (b.displayCurrency && b.displayCurrency !== "MAD" && b.displayTotal != null) {
            totalText += " (≈ " + b.displayTotal + " " + b.displayCurrency + ")";
          }
          document.getElementById("total").textContent = totalText;
          document.getElementById("status").textContent = b.status;

          if (b.status === "paid") {
            document.title = "Payment received | excursionmarrakech";
            document.getElementById("success-title").textContent = "Payment received";
            document.getElementById("success-body").textContent =
              "Thank you! Your payment was successful. A confirmation email is on its way with your trip details.";
            EM.trackEvent("Purchase", {
              value: b.totalAmount,
              currency: "MAD",
              content_name: b.tripTitle,
              transaction_id: b.id,
              bookingId: b.id,
            });
            EM.trackAdsConversion("Purchase", {
              value: b.totalAmount,
              currency: "MAD",
              transaction_id: b.id,
              bookingId: b.id,
            });
          } else if (b.status === "inquiry") {
            document.title = "Inquiry received | excursionmarrakech";
            document.getElementById("success-title").textContent = "Inquiry received";
            document.getElementById("success-body").textContent =
              "Thanks! We emailed you a copy of this inquiry. Our team will confirm availability and get back to you soon.";
            EM.trackEvent("Lead", {
              content_name: b.tripTitle,
              bookingId: b.id,
            });
            EM.trackAdsConversion("Lead", {
              bookingId: b.id,
            });
          } else {
            document.title = "Booking update | excursionmarrakech";
            document.getElementById("success-body").textContent =
              "Your booking is being processed. Status: " + b.status;
          }
        } catch (e) {
          document.getElementById("success-body").textContent = e.message;
        }
      })();
    </script>
  </body>
</html>
